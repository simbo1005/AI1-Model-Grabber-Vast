name: Build and publish Vast.ai Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: "1.4-test"
      runtime_base:
        description: Optional immutable image from this same repository for launcher-only updates
        required: false
        default: ""
      publish_latest:
        description: Also update the latest tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: sdcioba/comfyui-workflow-launcher-vast
  GHCR_IMAGE: ghcr.io/simbo1005/comfyui-workflow-launcher-vast

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate immutable native base
        if: ${{ inputs.runtime_base != '' }}
        env:
          RUNTIME_BASE: ${{ inputs.runtime_base }}
          EXPECTED_IMAGE: sdcioba/comfyui-workflow-launcher-vast
        run: |
          python3 - <<'PYCODE'
          import os, re
          expected = re.escape(os.environ["EXPECTED_IMAGE"])
          if not re.fullmatch(expected+r"@sha256:[0-9a-f]{64}", os.environ["RUNTIME_BASE"]):
              raise SystemExit("runtime_base must pin an image digest from this repository")
          PYCODE

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test launcher
        run: |
          python -m pip install -r requirements-launcher.txt pytest
          python -m pytest

      - name: Audit custom-node requirements
        run: python scripts/audit_node_requirements.py

      - name: Free runner disk space
        if: ${{ inputs.runtime_base == '' }}
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          docker system prune --all --force
          echo "Disk space after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sdcioba
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile and cache native SageAttention wheel
        if: ${{ inputs.runtime_base == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: sage-native
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:sage2-buildcache
            type=gha,scope=sage-native
          cache-to: |
            type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:sage2-buildcache,mode=max,ignore-error=true
            type=gha,scope=sage-native,mode=min,ignore-error=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.runtime_base != '' && 'docker/Dockerfile.runtime' || 'Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ inputs.tag }}
            ${{ env.GHCR_IMAGE }}:${{ inputs.tag }}
            ${{ inputs.publish_latest && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
            ${{ inputs.publish_latest && format('{0}:latest', env.GHCR_IMAGE) || '' }}
          build-args: |
            IMAGE_VERSION=${{ inputs.tag }}
            SOURCE_REVISION=${{ github.sha }}
            BASE_IMAGE=${{ inputs.runtime_base }}
          cache-from: |
            ${{ inputs.runtime_base == '' && format('type=registry,ref={0}:sage2-buildcache', env.DOCKERHUB_IMAGE) || '' }}
            ${{ inputs.runtime_base == '' && 'type=gha,scope=sage-native' || '' }}
            ${{ inputs.runtime_base == '' && 'type=gha' || '' }}
          cache-to: ${{ inputs.runtime_base == '' && 'type=gha,mode=min,ignore-error=true' || '' }}
